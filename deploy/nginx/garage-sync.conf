# Nginx site template for the sync server (HTTPS recommended)
# Replace:
# - server_name
# - proxy_pass port if your backend runs on a different port

server {
    listen 80;
    server_name sync.yourdomain.com;

    # Allow large sync payloads (e.g. Push all to server / full-push)
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# After enabling this site, run:
# - sudo certbot --nginx -d sync.yourdomain.com
# Certbot will add the TLS server {} block automatically.

